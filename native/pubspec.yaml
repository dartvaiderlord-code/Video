name: pirate_tavern
description: Native Windows screen sender and Android viewer for Pirate Tavern.
publish_to: none
version: 2.0.1+8
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc:
    path: vendor/flutter_webrtc
  file_picker: 10.3.10
  shared_preferences: 2.5.4
  crypto: 3.0.7
  cryptography: 2.9.0
  abordage_crypto:
    path: packages/abordage_crypto
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
