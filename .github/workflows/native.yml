name: Native Windows and Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: python tool/bootstrap.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows portable app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content windows-build.log -Tail 40 | ForEach-Object {
              $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $buildExitCode
          }
      - name: Windows capture conflict probe
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --target pirate_capture_probe 2>&1 | Tee-Object -FilePath capture-probe-build.log
          $probeExitCode = $LASTEXITCODE
          if ($probeExitCode -ne 0) {
            Get-Content capture-probe-build.log -Tail 30 | ForEach-Object { Write-Output "::error::$_" }
            exit $probeExitCode
          }
          & ".\build\windows\x64\diagnostics\Release\pirate_capture_probe.exe"
          exit $LASTEXITCODE
      - name: Build Android APK (test signing)
        if: matrix.target == 'android'
        run: flutter build apk --release --target-platform android-arm64,android-arm
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: Pirate-Tavern-Windows-x64
          path: native/build/windows/x64/runner/Release/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'android'
        with:
          name: Pirate-Tavern-Android-APK
          path: native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  media-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pulseaudio libglib2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libdrm2
      - name: Encode, send and decode actual high-bitrate and 120 FPS RTP
        run: PIRATE_RTC_WORK="$RUNNER_TEMP/pirate-rtc" sh native/tool/test_rtc.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-WebRTC-Regression
          path: ${{ runner.temp }}/pirate-rtc/*.log
