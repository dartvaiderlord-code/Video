name: Native Windows and Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: python tool/bootstrap.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows portable app
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Build Android APK (test signing)
        if: matrix.target == 'android'
        run: flutter build apk --release --target-platform android-arm64,android-arm
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: Pirate-Tavern-Windows-x64
          path: native/build/windows/x64/runner/Release/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'android'
        with:
          name: Pirate-Tavern-Android-APK
          path: native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
