name: Native Windows and Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'server.js', 'abordage.js', 'scripts/abordage*', '.github/workflows/native.yml']
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ABORDAGE_FFMPEG_FIXTURE_DIR: build/encoder-fixtures
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: python tool/bootstrap.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Build native AEAD for tests (Linux)
        if: matrix.target == 'android'
        run: |
          cc -shared -fPIC -O3 packages/abordage_crypto/src/monocypher.c packages/abordage_crypto/src/abordage_crypto.c -o "$RUNNER_TEMP/libabordage_crypto.so"
          echo "ABORDAGE_CRYPTO_LIBRARY=$RUNNER_TEMP/libabordage_crypto.so" >> "$GITHUB_ENV"
      - name: Build native AEAD for tests (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cmake -S packages/abordage_crypto/src -B build/crypto-test -A x64
          cmake --build build/crypto-test --config Release
          "ABORDAGE_CRYPTO_LIBRARY=$((Resolve-Path 'build/crypto-test/Release/abordage_crypto.dll').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: flutter test
      - name: Build Windows portable app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --no-pub 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $message = (Get-Content windows-build.log -Tail 60) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $buildExitCode
          }
      - name: Bundle pinned Abordage encoder and licenses
        if: matrix.target == 'windows'
        run: python tool/bundle_ffmpeg.py
      - name: Verify Abordage FFmpeg features
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $exe = '.\build\windows\x64\runner\Release\ffmpeg\bin\ffmpeg.exe'
          $manifest = Get-Content tool/ffmpeg-windows.json -Raw | ConvertFrom-Json
          $version = (& $exe -version 2>&1) -join "`n"
          if ($version -notmatch [regex]::Escape($manifest.version)) { throw "Unexpected bundled FFmpeg version" }
          $filters = (& $exe -hide_banner -filters 2>&1) -join "`n"
          $encoders = (& $exe -hide_banner -encoders 2>&1) -join "`n"
          foreach ($name in @('ddagrab','hwdownload','scale','format')) { if ($filters -notmatch $name) { throw "Missing capture filter $name" } }
          foreach ($name in @('h264_nvenc','h264_amf','h264_qsv','libx264')) { if ($encoders -notmatch $name) { throw "Missing encoder $name" } }
      - name: Real production command with UDP PCM audio
        if: matrix.target == 'windows'
        run: python tool/probe_ffmpeg_audio.py
      - name: Real media_kit Player.open UDP playlist regression
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $env:ABORDAGE_PLAYER_LIBRARY = (Resolve-Path 'build/windows/x64/runner/Release/libmpv-2.dll').Path
          $env:ABORDAGE_PLAYER_FFMPEG = (Resolve-Path 'build/windows/x64/runner/Release/ffmpeg/bin/ffmpeg.exe').Path
          flutter test test/playback_open_test.dart --reporter expanded 2>&1 | Tee-Object -FilePath player-open-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $message = (Get-Content player-open-test.log -Tail 50) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $testExit
          }
          Write-Output '::notice::PASS actual media_kit Player.open: old options reject UDP playlist; fixed options decode H264/AAC.'
      - name: Real Abordage UDP delivery into bundled libmpv (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          python tool/prepare_benchmark.py
          $env:ABORDAGE_CRYPTO_LIBRARY = (Resolve-Path 'build/windows/x64/runner/Release/abordage_crypto.dll').Path
          $env:ABORDAGE_REPO = (Resolve-Path '..').Path
          $nativeRoot = (Get-Location).Path
          $probe = Join-Path $env:RUNNER_TEMP 'abordage-playback-transport.exe'
          Push-Location $env:RUNNER_TEMP
          dart compile exe --packages="$nativeRoot/.dart_tool/abordage_package_config.json" "$nativeRoot/tool/abordage_playback_transport.dart" -o $probe
          $compileExit = $LASTEXITCODE
          Pop-Location
          if ($compileExit -ne 0) { exit $compileExit }
          python tool/probe_abordage_playback.py --transport-exe $probe
          exit $LASTEXITCODE
      - name: Abordage compatible conversion and DXGI probe
        if: matrix.target == 'windows'
        run: python tool/probe_ffmpeg.py
      - name: Windows capture conflict probe
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --target pirate_capture_probe 2>&1 | Tee-Object -FilePath capture-probe-build.log
          $probeExitCode = $LASTEXITCODE
          if ($probeExitCode -ne 0) {
            $message = (Get-Content capture-probe-build.log -Tail 40) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $probeExitCode
          }
          & ".\build\windows\x64\diagnostics\Release\pirate_capture_probe.exe"
          exit $LASTEXITCODE
      - name: Build Android APK (test signing)
        if: matrix.target == 'android'
        run: flutter build apk --release --target-platform android-arm64,android-arm
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: Pirate-Tavern-Windows-x64
          path: native/build/windows/x64/runner/Release/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'android'
        with:
          name: Pirate-Tavern-Android-APK
          path: native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  media-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pulseaudio libglib2.0-0t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libdrm2
      - name: Encode, send and decode actual high-bitrate and 120 FPS RTP
        run: PIRATE_RTC_WORK="$RUNNER_TEMP/pirate-rtc" sh native/tool/test_rtc.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-WebRTC-Regression
          path: ${{ runner.temp }}/pirate-rtc/*.log

  abordage-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential python3
      - run: npm ci && npm test
      - run: flutter pub get --enforce-lockfile
        working-directory: native
      - name: Actual encoded transport at 480 and 240 FPS with loss and reordering
        run: sh native/tool/test_abordage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Abordage-Regression
          path: native/build/abordage-benchmark/*.log
